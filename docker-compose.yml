services:
  app:
    build: .
    container_name: my-web-api-app
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  db:
    image: postgres:16-alpine
    container_name: my-web-api-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-express_web_api_db}
    ports:
      - "${HOST_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data # データを永続化
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d express_web_api_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  db-data:
